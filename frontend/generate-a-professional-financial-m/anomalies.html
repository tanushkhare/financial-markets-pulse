<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anomalies // Financial Markets Pulse</title>
  <style>
    :root {
      --bg-main: #060913; --bg-card: #0d1322; --bg-card-hover: #131c31;
      --accent-red: #ff3366; --accent-blue: #00d2ff;
      --text-main: #f8fafc; --text-muted: #64748b; --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, monospace, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border); padding: 16px 24px; border-radius: 12px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon { width: 12px; height: 12px; background: var(--accent-red); border-radius: 50%; box-shadow: 0 0 12px var(--accent-red); }
    .logo-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1px; color: #fff; }
    nav { display: flex; gap: 10px; }
    .nav-link { color: var(--text-muted); text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; border: 1px solid transparent; }
    .nav-link.active { background: rgba(255, 51, 102, 0.1); color: var(--accent-red); border-color: rgba(255, 51, 102, 0.3); }
    .nav-link:hover { color: var(--text-main); background: var(--bg-card-hover); }
    .status-pill { background: rgba(255, 51, 102, 0.1); color: var(--accent-red); border: 1px solid var(--accent-red); padding: 6px 14px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .card-title { font-size: 0.95rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
    td { padding: 16px 12px; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
    tr:hover { background: var(--bg-card-hover); }
    .badge-anomaly { background: rgba(255, 51, 102, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 51, 102, 0.3); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div class="logo-area"><div class="logo-icon"></div><div class="logo-title">FINANCIAL MARKETS PULSE</div></div>
    <nav>
      <a href="index.html" class="nav-link">Live Tickers</a>
      <a href="anomalies.html" class="nav-link active">Anomaly Audits</a>
      <a href="analytics.html" class="nav-link">Analytics & Charts</a>
    </nav>
    <div class="status-pill">AUDIT STREAM</div>
  </header>
  <main class="card">
    <div class="card-header"><span class="card-title">Flagged High-Volatility Market Anomalies</span></div>
    <table>
      <thead><tr><th>Timestamp</th><th>Symbol</th><th>Price</th><th>Volume</th><th>Volatility</th><th>Audit Status</th></tr></thead>
      <tbody id="anomalyTableBody"><tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 40px;">Querying anomaly logs...</td></tr></tbody>
    </table>
  </main>
  <script>
    const API_BASE_URL = "https://financial-markets-pulse-api.onrender.com";
    async function fetchAnomalies() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/v1/anomalies`);
        const data = await res.json();
        if (Array.isArray(data) && data.length > 0) {
          let html = "";
          data.forEach(item => {
            html += `<tr><td>${item.time ? new Date(item.time).toLocaleTimeString() : 'N/A'}</td><td><strong>${item.symbol}</strong></td><td>$${Number(item.price).toFixed(2)}</td><td>${Number(item.volume).toLocaleString()}</td><td>${Number(item.volatility || 0).toFixed(4)}</td><td><span class="badge-anomaly">⚠️ FLAGGED ANOMALY</span></td></tr>`;
          });
          document.getElementById('anomalyTableBody').innerHTML = html;
        } else {
          document.getElementById('anomalyTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 40px;">No anomalies flagged in current time window. System stable.</td></tr>`;
        }
      } catch (err) { console.error("Failed to load anomalies", err); }
    }
    window.onload = fetchAnomalies;
  </script>
</body>
</html>
